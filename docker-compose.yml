services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/bondai
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY}
      BLIND_INDEX_HMAC_KEY: ${BLIND_INDEX_HMAC_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENABLE_DEV_DEMO_ACCOUNTS: "false"
    volumes:
      - bondai_data:/app/data
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  bondai_data:
  mongo_data:
  redis_data:
